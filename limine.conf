# Timeout in seconds that Limine will use before automatically booting.
timeout: 1 

# The entry name that will be displayed in the boot menu.
/Limine LearnixOS 
    protocol: limine
    path: boot():/boot/kernel

    # Userspace programs
    module_cmdline: init 
    module_path: boot():/boot/init

    module_cmdline: sh 
    module_path: boot():/boot/sh

    module_cmdline: test
    module_path: boot():/boot/test

    module_cmdline: echo
    module_path: boot():/boot/echo

    module_cmdline: brainfuck
    module_path: boot():/boot/brainfuck

    module_cmdline: bench
    module_path: boot():/boot/bench

    module_cmdline: ciao.txt
    module_path: boot():/boot/ciao.txt
